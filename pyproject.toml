[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygamlab"
version = "2.0.0"
description = "A scientific Python library with constants, unit convertors, formulas, and data analysis tools."
authors = [
  { name="Ali Pilehvar Meibody", email="alipilehvar1999@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"  # Simplified license specification
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "ase",
    "plotly",
    "PyQt5",
    "jarvis",
    "mp_api",
    "aflow"
]

[project.urls]
Source = "https://github.com/APMaii/pygamlab/tree/main"